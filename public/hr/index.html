<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/hr.css">
  <title>HR sign in · Zinnov GMR Inventory</title>
  <script type="module" src="/assets/js/hr-login.js"></script>
</head>
<body class="login-page">
  <main class="login">
    <aside class="login-side">
      <a class="brand light" href="/"><span class="brand-mark">Zinnov<span>.</span></span></a>
      <div class="login-side-body">
        <p class="eyebrow light">Panel workspace</p>
        <h1 class="display light">Growth Mindset &amp; <em>Resilience</em> Inventory</h1>
        <p class="eyebrow light workflow-title">Workflow</p>
        <ol class="workflow" data-workflow></ol>
      </div>
      <p class="login-side-foot small">Self-assessment reflects the candidate's perception, not verified competence.</p>
    </aside>

    <section class="login-main">
      <form class="login-form" data-login novalidate>
        <h2 class="h2">Sign in</h2>
        <p class="muted">For HR and interview panel members.</p>
        <div class="alert" data-login-error role="alert" hidden></div>
        <div class="field">
          <label for="l-email">Work email</label>
          <input class="input" id="l-email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="l-pass">Password</label>
          <div class="pw">
            <input class="input" id="l-pass" name="password" type="password" autocomplete="current-password" required>
            <button class="pw-toggle" type="button" data-toggle-pw aria-label="Show password">Show</button>
          </div>
        </div>
        <button class="btn btn-accent login-btn" type="submit">Sign in</button>
        <p class="small muted login-help">No account? Ask your workspace administrator to create one.</p>
      </form>
    </section>
  </main>
</body>
</html>
