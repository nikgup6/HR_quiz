<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/hr.css">
  <link rel="stylesheet" href="/assets/css/print.css" media="print">
  <title>Panel insight report · Zinnov GMR Inventory</title>
  <script type="module" src="/assets/js/hr-report.js"></script>
</head>
<body data-page="report">
  <header class="topbar" data-shell></header>
  <main class="wrap page" data-report>
    <div class="report-loading"><span class="spinner dark"></span> Loading report…</div>
  </main>
  <dialog data-delete-dialog aria-labelledby="del-title">
    <div class="dialog-body">
      <h2 class="h3" id="del-title">Delete this submission?</h2>
      <p class="muted">The candidate's responses, scores and all panel notes will be permanently removed. This cannot be undone.</p>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-ghost btn-sm" type="button" data-cancel-delete>Cancel</button>
      <button class="btn btn-sm btn-delete" type="button" data-confirm-delete>Delete permanently</button>
    </div>
  </dialog>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
